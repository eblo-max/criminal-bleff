<svg xmlns="http://www.w3.org/2000/svg" width="800" height="60">
  <defs>
    <pattern id="police-tape" patternUnits="userSpaceOnUse" width="100" height="60">
      <rect width="100" height="60" fill="#000" />
      <polygon points="0,0 100,0 100,30 0,30" fill="#F7D413" />
      <polygon points="100,30 0,30 0,60 100,60" fill="#F7D413" />
      <text transform="translate(5, 20) rotate(-5)" fill="#000" font-family="Arial, sans-serif" font-weight="bold" font-size="14">CRIME SCENE</text>
      <text transform="translate(5, 50) rotate(5)" fill="#000" font-family="Arial, sans-serif" font-weight="bold" font-size="14">DO NOT CROSS</text>
    </pattern>
  </defs>
  <rect width="800" height="60" fill="url(#police-tape)" />
</svg> 