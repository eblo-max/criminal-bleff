<svg xmlns="http://www.w3.org/2000/svg" width="180" height="80" viewBox="0 0 180 80">
  <defs>
    <filter id="stamp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="rotate(-10 90 40)" filter="url(#stamp-shadow)">
    <rect x="5" y="5" width="170" height="70" rx="5" ry="5" fill="none" stroke="#ff0026" stroke-width="3" />
    <rect x="10" y="10" width="160" height="60" rx="3" ry="3" fill="none" stroke="#ff0026" stroke-width="1" />
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff0026" text-anchor="middle">СОВЕРШЕННО</text>
    <text x="90" y="65" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff0026" text-anchor="middle">СЕКРЕТНО</text>
    <text id="date" x="90" y="25" font-family="Courier, monospace" font-size="12" fill="#ff0026" text-anchor="middle">27.04.2025</text>
  </g>
</svg> 